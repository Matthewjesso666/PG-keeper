[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-keeper"
version = "0.1.0"
description = "CLI and API utilities for managing and drafting Workers' Compensation Board case materials."
authors = [{name = "PG Keeper", email = ""}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "pydantic>=2.6",
  "fastapi>=0.109",
  "uvicorn>=0.23",
  "chromadb>=0.4",
  "faiss-cpu>=1.7",
]

[project.optional-dependencies]
api = ["python-multipart>=0.0.9"]

[project.scripts]
pg-keeper = "pg_keeper.cli:main"
pg-keeper-ingest = "pg_keeper.cli:pg_keeper_ingest"
pg-keeper-chat = "pg_keeper.cli:pg_keeper_chat"
pg-keeper-draft = "pg_keeper.cli:pg_keeper_draft"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
